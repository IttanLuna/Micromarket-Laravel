services:
  composer:
    image: composer:2
    container_name: micromarket-composer
    working_dir: /app
    environment:
      - COMPOSER_PROCESS_TIMEOUT=0
    volumes:
      - ./src:/app
    command: >
      sh -c "if [ ! -f /app/composer.json ]; then
             composer create-project laravel/laravel . --prefer-dist --no-interaction;
             fi"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: micromarket-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    networks:
      - micromarket
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: micromarket-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - micromarket
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: micromarket-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-micromarket}
      MYSQL_USER: ${DB_USERNAME:-micromarket}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - micromarket

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: micromarket-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - micromarket
    depends_on:
      - db

volumes:
  dbdata:

networks:
  micromarket:
    driver: bridge
